name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
      - Update_2
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w server

      - name: Build backend
        run: npm run build -w server

      - name: Verify build output
        run: |
          echo "=== Checking built server files ==="
          ls -la server/dist/
          echo "=== Checking for server.js ==="
          if [ -f server/dist/server.js ]; then
            echo "✓ server.js found at server/dist/server.js"
          else
            echo "✗ ERROR: server.js not found at server/dist/server.js"
            ls -R server/dist/
            exit 1
          fi
          echo "=== Verifying compiled TypeScript files ==="
          find server/dist -name "*.js" | head -20

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r server/dist deploy/dist
          # Copy root node_modules for shared dependencies
          cp -r node_modules deploy/node_modules
          # Copy server node_modules (where Prisma client is generated)
          if [ -d server/node_modules ]; then
            cp -r server/node_modules/* deploy/node_modules/
          fi
          cp -r server/prisma deploy/prisma
          cp server/package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp server/web.config deploy/web.config
          cd deploy && zip -r ../deployment.zip . && cd ..

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: vidyavault-api-israfil
          package: ./deployment.zip


      - name: Configure startup command
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "=== Setting startup command ==="
            az webapp config set \
              -g vidyavault-rg \
              -n vidyavault-api-israfil \
              --startup-file "node dist/server.js"
            echo "✓ Startup command configured"

            echo "=== Verifying configuration ==="
            az webapp config show -g vidyavault-rg -n vidyavault-api-israfil --query "startupCommand"

      - name: Start App Service
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp start -g vidyavault-rg -n vidyavault-api-israfil

      - name: Wait for app to start
        run: |
          echo "=== Waiting for app to be healthy ==="
          APP_URL="https://vidyavault-api-israfil.azurewebsites.net/api/health"
          for i in {1..40}; do
            echo "Attempt $i/40: Checking $APP_URL"
            if curl -s -f -m 5 "$APP_URL" > /dev/null 2>&1; then
              echo "✓ App is healthy on attempt $i"
              exit 0
            fi
            if [ $i -lt 40 ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          echo "✗ App startup timeout after 400 seconds"
          echo "=== Getting app service logs ==="
          az webapp log download -g vidyavault-rg -n vidyavault-api-israfil --log-file ./app-logs.zip || true
          exit 1

      - name: Get App Settings
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "=== Fetching DATABASE_URL from Azure ==="
            DB_URL=$(az webapp config appsettings list -g vidyavault-rg -n vidyavault-api-israfil --query "[?name=='DATABASE_URL'].value" -o tsv)
            
            if [ -z "$DB_URL" ]; then
              echo "Error: Could not retrieve DATABASE_URL from Azure App Service"
              exit 1
            fi
            
            # Mask the URL in logs
            echo "::add-mask::$DB_URL"
            # Write to GITHUB_ENV for subsequent steps
            echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Run Migrations and Seed
        run: |
          echo "=== Running Migrations ==="
          npx prisma migrate deploy --schema=server/prisma/schema.prisma
          
          echo "=== Seeding Database ==="
          export SUPERADMIN_EMAIL="israfilhoque523@gmail.com"
          export SUPERADMIN_PASSWORD="${{ secrets.SUPERADMIN_PASSWORD }}"
          export SUPERADMIN_USERNAME="superadmin"
          # Use tsx from node_modules to run the seed file
          ./node_modules/.bin/tsx server/prisma/seed.ts

      - name: Verify deployment
        env:
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: |
          echo "=== Health Check ==="
          curl -s https://vidyavault-api-israfil.azurewebsites.net/api/health | jq .

          echo ""
          echo "=== Login Test ==="
          # Safely construct JSON using jq to handle special characters in password
          JSON_PAYLOAD=$(jq -n --arg id "superadmin" --arg pw "$SUPERADMIN_PASSWORD" '{identity: $id, password: $pw}')
          
          RESPONSE=$(curl -s -X POST https://vidyavault-api-israfil.azurewebsites.net/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD")

          if echo "$RESPONSE" | jq -e '.data.token' > /dev/null 2>&1; then
            echo "✓ Superadmin login successful"
            # Don't print the whole response to avoid leaking sensitive info if any
            echo "Login status: Success"
          else
            echo "✗ Superadmin login failed"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Deployment summary
        if: success()
        run: |
          echo "✓ Backend deployed successfully!"
          echo "API URL: https://vidyavault-api-israfil.azurewebsites.net"
          echo "Database: mirage"
          echo "Superadmin Email: israfilhoque523@gmail.com"

name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-static-webapp.yml'
      - 'client/staticwebapp.config.json'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build -w client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy staticwebapp.config.json
        run: cp client/staticwebapp.config.json client/dist/


      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "client/dist"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true

      - name: Verify deployment
        run: |
          echo "✅ Frontend deployed to: https://agreeable-sky-0af95e400.7.azurestaticapps.net"

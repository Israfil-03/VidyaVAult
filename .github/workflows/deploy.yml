name: Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w server

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build client
        run: npm run build -w client

      - name: Build server
        run: npm run build -w server

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build -w client

      - name: Build server
        run: npm run build -w server

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vidyavault-api-israfil'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Check deployment health
        run: |
          for i in {1..30}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://vidyavault-api-israfil.azurewebsites.net/api/health)
            if [ "$response" = "200" ]; then
              echo "✅ Deployment successful! API is healthy."
              exit 0
            fi
            echo "Attempt $i: API health check returned $response, retrying..."
            sleep 2
          done
          echo "❌ API health check failed after multiple attempts"
          exit 1
